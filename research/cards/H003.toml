id = "H003"
title = "BTC leads, lagging alts follow"
author = "claude-opus-5-5"
created = "2026-10-15"
builder = "h003_btc_lead"
symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "BNBUSDT", "XRPUSDT", "DOGEUSDT", "ADAUSDT", "AVAXUSDT", "LINKUSDT", "LTCUSDT"]

mechanism = """Market-wide information (macro prints, ETF flows) hits BTC first; liquidity providers in alts update
quotes with a lag. When BTC moves at least k sigma in an hour and an alt moved less than half as much (in its own
sigma units), the alt is expected to catch up over the next `hold` hours. Trade the alt in BTC's direction; BTC is
never traded."""
counterparty = "Slow alt liquidity providers and resting limit orders left at stale prices."
signal = "z_BTC >= k and z_alt < 0.5 * z_BTC -> long the alt at the next open (mirror for shorts); stop 3 x ATR; TP 3R; time exit after `hold` bars."
falsified_if = "OOS net PF incl. funding < 1.2, or the 95% bootstrap lower bound of expectancy R <= 0, or deflated Sharpe < 0.95."
notes = """Lead-lag in liquid crypto is known to be arbitraged within seconds to minutes; on 1h bars with next-open entry
this may already be gone. That is the main reason it could fail, and the test is cheap."""

[fixed]
stop_atr = 3.0
tp_r = 3.0
lag_frac = 0.5

[grid]
k = [2.5, 3.5]
hold = [1, 3]
