[project]
name = "opusjev"
version = "0.1.0"
description = "Otonom, kısa vadeli, düşük riskli kripto paper-trading sistemi (jev karar + deterministik risk)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pydantic>=2.6",
    "requests>=2.31",
    "typesafe-sdk==0.7.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
research = ["yfinance>=0.2"]

[project.scripts]
opusjev = "opusjev.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["opusjev*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
